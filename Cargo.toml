[package]
name = "media-proxy"
version = "0.1.0"
edition = "2021"
authors = ["NezuChan <support@nezuchan.com>"]
license = "GPL-3.0"
repository = "https://github.com/NezuChan/media-proxy"
homepage = "https://github.com/NezuChan/media-proxy"
description = "A fast media proxy service for images and audio"

[[bin]]
name = "media-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
tower-http = { version = "0.6", features = ["trace"] }

reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }

image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }

aes = "0.8"
cbc = "0.1"
hex = "0.4"

bytes = "1"
urlencoding = "2"
moka = { version = "0.12", features = ["future"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
